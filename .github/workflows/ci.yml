name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify formatting, types, lint, tests and build
        run: npm run verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke checks
        run: npm run test:e2e
      - name: Verification summary
        if: always()
        env:
          VERIFICATION_STATUS: ${{ job.status }}
        run: |
          echo "## Frontend verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Job result: $VERIFICATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "Deterministic checks only; this is not an AI review or a backend integration test." >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node --input-type=module -e 'import fs from "node:fs"; const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total; for (const [k,v] of Object.entries(t)) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${k}: ${v.pct}%\n`);'
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-verification
          archive: true
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
